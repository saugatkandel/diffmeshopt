[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diffmeshopt"
version = "0.1.0"
description = "Differentiable surface mesh generation for 3D segmentation refinement"
authors = [{ name = "saugat", email = "saugat.kandel@u.northwestern.edu" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=2.4.0,<3",
    "scipy>=1.17.0,<2",
    "trimesh>=4.10.1,<5",
    "scikit-image>=0.26.0,<0.27",
    "opencv-python>=4.11.0.86,<5",
    "tqdm>=4.67.1,<5",
    "click>=8.3.1,<9",
    "joblib>=1.5.3,<2",
    "matplotlib>=3.10.8,<4",
    "lightning>=2.6.0,<3",
    "polars>=1.37.1,<2",
    "rich>=14.2.0,<15",
    "tensorboard>=2.20.0,<3",
]

[project.optional-dependencies]
notebook = [
    "ipykernel>=7.1.0,<8",
    "plotly>=6.5.1,<7",
    "jupyterlab>=4.5.1,<5",
    "ipywidgets>=8.1.8,<9",
]
cryoet = [
    "zarr>=3.1.5,<4",
    "ome-zarr>=0.12.2,<0.13",
    "cryoet-data-portal>=4.5.0,<5",
]
test = ["pytest>=8.0.0"]
pytorch3d = [
    "setuptools",
    "pytorch3d @ git+https://github.com/facebookresearch/pytorch3d.git", # 3D geometry
]

# --- RUFF SETTINGS ---
[tool.ruff]
line-length = 99
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["diffmeshopt"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 99

# --- HATCH SETTINGS ---
[tool.hatch.build.targets.wheel]
packages = ["diffmeshopt"]

[tool.hatch.metadata]
# Allow direct references (e.g., git URLs) in project.dependencies
allow-direct-references = true


# --- PIXI INTEGRATION ---
[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.13.*"


[tool.pixi.tasks]
generate-data = "python diffmeshopt/opt2d/generate_2d_data.py"
pytest = "pytest tests/opt2d"

[tool.pixi.environments]
# Environments are now simple lists of features
default = { features = ["gpu", "test", "localdev"] }
ci = { features = ["cpu", "test"] }

# --- FEATURES ---

# This feature ensures the local 'diffmeshopt' package is installed with [test] extras
[tool.pixi.feature.test.pypi-dependencies]
diffmeshopt = { path = ".", editable = true, extras = ["test"] }

[tool.pixi.feature.localdev.pypi-dependencies]
diffmeshopt = { path = ".", editable = true, extras = ["notebook", "cryoet"] }


[tool.pixi.feature.cpu.pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cpu"]
index-strategy = "unsafe-best-match"
no-build-isolation = ["pytorch3d"]

[tool.pixi.feature.cpu.pypi-dependencies]
torch = { version = ">=2.9.1, <3", index = "https://download.pytorch.org/whl/cpu" }
torchvision = { version = ">=0.24.1, <0.25", index = "https://download.pytorch.org/whl/cpu" }

[tool.pixi.feature.gpu.pypi-dependencies]
torch = ">=2.9.1, <3"
torchvision = ">=0.24.1, <0.25"
#pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git" }
