[workspace]
name = "diffmeshopt"
version = "0.1.0"
description = "Differentiable surface mesh generation for 3D segmentation refinement"
authors = ["saugat <saugat.kandel@u.northwestern.edu>"]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
start = "python src/main.py"
test = "pytest"
lab = "jupyter lab"

[dependencies]
python = "3.12.*"

[pypi-options]
no-build-isolation = ["pytorch3d"]

[pypi-dependencies]
pytest = "*"
torch = ">=2.9.1, <3"
numpy = ">=2.4.0, <3"
trimesh = ">=4.10.1, <5"
matplotlib = ">=3.10.8, <4"
jupyterlab = ">=4.5.1, <5"
scikit-image = ">=0.26.0, <0.27"
tqdm = ">=4.67.1, <5"
torchvision = ">=0.24.1, <0.25"
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git" }
ipywidgets = ">=8.1.8, <9"
jupyter = ">=1.1.1, <2"
zarr = ">=3.1.5, <4"
ome-zarr = ">=0.12.2, <0.13"
awscli = ">=1.44.13, <2"
cryoet-data-portal = ">=4.5.0, <5"
