name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install CPU-only PyTorch to save download time and space
        pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
        
        # Install the project dependencies (including test extras)
        # Note: Installing pytorch3d from source can take a few minutes
        pip install ".[test]"

    - name: Run tests
      run: |
        pytest