name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main" ]  # Runs every time you push to main
  workflow_dispatch:      # Allows you to run it manually from the UI

jobs:

  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- ADD THIS STEP TO FIX "NO SPACE LEFT ON DEVICE" ---
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          # Point to your specific renamed Dockerfile in the subfolder
          file: .devcontainer/runpod_dockerfile
          push: true
          # Replace 'yourusername' with your actual Docker Hub ID
          tags: saugatkandel12/diffmeshopt-env:latest
